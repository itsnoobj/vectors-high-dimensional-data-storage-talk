<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#1e1e2e"/>
  
  <!-- FP32 -->
  <text x="100" y="155" font-family="monospace" font-size="28" font-weight="bold" fill="#cdd6f4">FP32</text>
  <text x="100" y="185" font-family="monospace" font-size="16" fill="#6c7086">32 bits per value</text>
  <rect x="280" y="135" width="700" height="48" rx="8" fill="#f38ba8" opacity="0.6"/>
  <text x="630" y="167" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#cdd6f4">6 GB @ 1M  ·  614 GB @ 100M</text>
  
  <!-- Arrow -->
  <text x="580" y="245" font-family="monospace" font-size="22" fill="#6c7086" text-anchor="middle">↓ 4×</text>
  
  <!-- INT8 -->
  <text x="100" y="315" font-family="monospace" font-size="28" font-weight="bold" fill="#cdd6f4">INT8</text>
  <text x="100" y="345" font-family="monospace" font-size="16" fill="#6c7086">8 bits per value</text>
  <rect x="280" y="295" width="175" height="48" rx="8" fill="#f9e2af" opacity="0.6"/>
  <text x="490" y="327" font-family="monospace" font-size="20" font-weight="bold" fill="#cdd6f4">1.5 GB @ 1M  ·  ~99% recall</text>
  
  <!-- Arrow -->
  <text x="580" y="405" font-family="monospace" font-size="22" fill="#6c7086" text-anchor="middle">↓ 32×</text>
  
  <!-- Binary -->
  <text x="100" y="475" font-family="monospace" font-size="28" font-weight="bold" fill="#cdd6f4">Binary</text>
  <text x="100" y="505" font-family="monospace" font-size="16" fill="#6c7086">1 bit per value</text>
  <rect x="280" y="455" width="22" height="48" rx="8" fill="#a6e3a1" opacity="0.7"/>
  <text x="490" y="487" font-family="monospace" font-size="20" font-weight="bold" fill="#cdd6f4">192 MB @ 1M  ·  + re-rank → ~95%</text>
  
  <!-- Divider -->
  <line x1="100" y1="570" x2="1100" y2="570" stroke="#313244" stroke-width="1"/>
  
  <!-- Bottom insight -->
  <text x="600" y="625" text-anchor="middle" font-family="monospace" font-size="24" fill="#cdd6f4">Search the blurry version fast.</text>
  <text x="600" y="665" text-anchor="middle" font-family="monospace" font-size="24" fill="#a6e3a1">Re-rank with the sharp version for accuracy.</text>
</svg>
